<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Acceso Presidente de Mesa
    </title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <!-- CAPA OSCURA -->
    <div class="overlay"></div>

    <!-- LOGO ONPE -->
    <div class="logo-onpe">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQciM-hhfMu2rZwVIHWDBEOoxK3gbAJfnxZCA&s"
             alt="Logo ONPE">

    </div>

    <!-- CONTENEDOR -->
    <div class="login-container">

        <h1>
            🗳️ Presidente de Mesa
        </h1>

        <p class="subtitulo">

            Sistema de Gestión Electoral

        </p>

        <div class="contenedor-google">

            <button type="button"
                    id="btnGoogle"
                    class="btn-google">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
                    alt="Google">
                <span>
                    Continuar con Google
                </span>
            </button>

        </div>

        <p class="info-login">

            Solo los correos autorizados podrán
            administrar la mesa electoral.

        </p>

        <p id="mensajeError"></p>

    </div>

    <!-- LOGIN -->
    <script type="module"
            src="login.js">

    </script>

</body>

</html>
